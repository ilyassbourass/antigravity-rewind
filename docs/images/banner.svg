<svg width="1200" height="420" viewBox="0 0 1200 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1200" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0a0c10" />
      <stop offset="50%" stop-color="#12161f" />
      <stop offset="100%" stop-color="#0b0e14" />
    </linearGradient>

    <!-- Glowing Cyan Accents -->
    <radialGradient id="glowCyan" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(200 120) rotate(90) scale(280 400)">
      <stop stop-color="#06b6d4" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glowIndigo" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1000 300) rotate(90) scale(260 400)">
      <stop stop-color="#6366f1" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>

    <!-- Title Gradient -->
    <linearGradient id="titleGrad" x1="0" y1="0" x2="700" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#67e8f9" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Badge Stroke Gradient -->
    <linearGradient id="badgeStroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.3" />
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="420" rx="20" fill="url(#bgGrad)" />
  <rect width="1200" height="420" fill="url(#glowCyan)" />
  <rect width="1200" height="420" fill="url(#glowIndigo)" />
  <rect width="1198" height="418" x="1" y="1" rx="19" stroke="#1f2937" stroke-width="1.5" fill="none" />

  <!-- Grid Accents -->
  <g opacity="0.07">
    <path d="M0 60 H1200 M0 120 H1200 M0 180 H1200 M0 240 H1200 M0 300 H1200 M0 360 H1200" stroke="#06b6d4" stroke-width="1" />
    <path d="M120 0 V420 M240 0 V420 M360 0 V420 M480 0 V420 M600 0 V420 M720 0 V420 M840 0 V420 M960 0 V420 M1080 0 V420" stroke="#06b6d4" stroke-width="1" />
  </g>

  <!-- Rewind Icon Graphic (Left) -->
  <g transform="translate(110, 140)">
    <circle cx="70" cy="70" r="68" fill="#131b26" stroke="url(#badgeStroke)" stroke-width="2" />
    <!-- Clock / Rewind Circular Arrow -->
    <path d="M70 30 A40 40 0 1 0 105 50" fill="none" stroke="#22d3ee" stroke-width="6" stroke-linecap="round" />
    <path d="M108 32 L105 52 L86 48" fill="#22d3ee" stroke="#22d3ee" stroke-width="2" stroke-linejoin="round" />
    <!-- Center Hands -->
    <path d="M70 70 L70 48 M70 70 L52 70" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" />
    <circle cx="70" cy="70" r="5" fill="#ffffff" />
  </g>

  <!-- Header Category Pill -->
  <g transform="translate(300, 115)">
    <rect width="270" height="30" rx="15" fill="#082f49" stroke="#0284c7" stroke-width="1" />
    <circle cx="16" cy="15" r="4" fill="#38bdf8" />
    <text x="30" y="20" fill="#bae6fd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" letter-spacing="1">GOOGLE ANTIGRAVITY ENGINE</text>
  </g>

  <!-- Main Title -->
  <text x="300" y="195" fill="url(#titleGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="800" letter-spacing="-1">
    Antigravity Rewind
  </text>

  <!-- Tagline -->
  <text x="300" y="235" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="400">
    Surgical In-Chat Undo, 6-Layer SQLite Rollback &amp; Session Time Machine
  </text>

  <!-- Feature Badges -->
  <g transform="translate(300, 275)">
    <!-- Badge 1 -->
    <rect width="180" height="34" rx="8" fill="#111827" stroke="#1e293b" stroke-width="1" />
    <text x="14" y="22" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">⚡ In-Chat Hover Undo</text>

    <!-- Badge 2 -->
    <rect x="195" width="190" height="34" rx="8" fill="#111827" stroke="#1e293b" stroke-width="1" />
    <text x="210" y="22" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">🛡️ 6-Layer SQLite Engine</text>

    <!-- Badge 3 -->
    <rect x="400" width="180" height="34" rx="8" fill="#111827" stroke="#1e293b" stroke-width="1" />
    <text x="415" y="22" fill="#a78bfa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">🔄 1-Click IDE Restart</text>

    <!-- Badge 4 -->
    <rect x="595" width="165" height="34" rx="8" fill="#111827" stroke="#1e293b" stroke-width="1" />
    <text x="610" y="22" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">📦 Zero-Install EXE</text>
  </g>

  <!-- Footer Accent Bar -->
  <rect x="0" y="415" width="1200" height="5" fill="url(#titleGrad)" />
</svg>
